candidate:
  name: "Nina — Primary teacher (grades 1–5)"
  summary: >
    South African primary-school teacher (grades 1–5) with a Bachelor of Education,
    TEFL certification, and about four years of classroom experience. Fluent in
    English and Afrikaans. Targeting United States onsite/hybrid teaching roles
    (especially Southern / Bible Belt states), with openness to J-1 / H-1B
    sponsorship or self-sponsorship pathways; also remote full-time or part-time
    tutoring / online teaching / curriculum / edtech; and US administrative
    assistant roles.
  qualifications:
    - Bachelor of Education
    - TEFL
    - Approximately 4 years teaching experience
    - Fluent English
    - Fluent Afrikaans
  nationality: South African
  do_not_claim:
    - US teaching license already held (unless a posting does not require one)
    - Special education specialist unless the ad is generalist primary
    - Secondary subject-matter specialist (high-school only) as primary fit
    - Spanish teacher / Spanish immersion / bilingual-Spanish classroom
    - Supply chain, logistics, warehouse, or fulfillment roles

