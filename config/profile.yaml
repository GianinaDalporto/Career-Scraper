geographic:
  remote:
    origin_anywhere: true
    prefer_scopes:
      - worldwide
      - anywhere
      - global
      - us_only
      - unknown
    # Nina is targeting the USA — US-only remote is desirable, not a reject.
    reject_us_only: false
    reject_australia_only: true
    reject_europe_only: true
    reject_if_explicitly_excludes_south_africa: false
    keep_unknown: true
    flag_unknown: true
  onsite_hybrid_countries:
    - US
  preferred_us_states:
    - TX
    - AL
    - TN
    - SC
    - NC
    - KY
    - FL
    - CO
    - GA
    - MS
    - LA
    - AR
    - OK
    - VA
    - WV
    - MO
  search_regions:
    - United States (Southern / Bible Belt preferred)
    - United States remote
  assume_work_rights:
    ZA: true
    US: false

hard_filters:
  reject_inactive: true
  reject_expired: true
  reject_empty_title: true
  reject_empty_company_optional: false
  flag_unknown_visa_status: true
  # Existing US work-authorisation requirements: flag in scoring/digest, never hard-reject.
  hard_reject_existing_work_auth_required: false
  hard_reject_us_citizenship_required: false
  never_invent_salary: true
  never_use_third_party_salary_estimates: true
  # Title/subject exclusions — Nina is generalist primary (1–5), English/Afrikaans, not Spanish/logistics.
  reject_title_phrases:
    - spanish teacher
    - spanish immersion
    - bilingual spanish
    - dual language spanish
    - french teacher
    - german teacher
    - mandarin teacher
    - chinese teacher
    - pe teacher
    - physical education teacher
    - supply chain
    - logistics coordinator
    - warehouse clerk
    - shipping clerk
    - inventory clerk
    - fulfillment
    - procurement
    - customer success

